<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>It's Cooked</title>
    <meta name="description" content="It's Cooked — your recipes, hands-free Cook Mode, smart timers and offline kitchen companion." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFF8F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1411" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="It's Cooked" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var t = localStorage.getItem('its-cooked:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
